  <body>
    <script>
      async function obtenerDatos() {
        const API_URL = `https://api.restcountries.com/countries/v5?q=canada`;

        try {
          const respuesta = await fetch(API_URL, {
            headers: {
              Authorization: "Bearer rc_live_c15d4a0895284e529345e9eb4cd3a21b",
            },
          });

          if (!respuesta.ok) {
            throw new Error(`No hay comunicación con el servidor`);
          }
        } catch (e) {
          console.error(`No se pudo concretar la operación: ${e}`);
        }
      }

      obtenerDatos();
    </script>
  </body>
</html>
