<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
  <BUtton type="button" id="mensaje" >Mensaje</BUtton>
  <input type="text" id="caja">

  <script>
    //Propiedad : caracteristicas objetos (nombre, ubicacion , color)
    //Metodo : acciones (verbo infinitivo)
    //Evento : respuesta (clic, arrastrar)

    //E1: Al cargar la pagina
    //DOM : Contenido de la pagina | Documento Object Model
    document.addEventListener("DOMContentLoaded", function (){
      console.log("DOM fue cargado completamente...")

      const boton = document.getElementById("mensaje")
      //E2: Clic (pulsar el boton)
      boton.addEventListener("click", function (){
        console.log("Hola mundo desde JS")
      })

      //Que significa addEventListerner?
      //agregar evento de escucha/atención
      //E3: focus (enfoque)
     const contenido = document.getElementById("caja")
     contenido.addEventListener("focus", function (){
      console.log("Elemento activo la caja")
     })



    })
  </script>
</body>
</html>
